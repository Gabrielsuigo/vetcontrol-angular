<div class="register-page">
  <div class="register-overlay"></div>

  <div class="register-card">
    <div class="register-header">
      <h1>Crear Veterinaria</h1>

      <p>Configurá tu veterinaria y el administrador principal</p>
    </div>

    <form class="register-form" (ngSubmit)="registrarse()">
      <div class="register-grid">
        <!-- ADMINISTRADOR -->
        <div class="register-section">
          <h2>Datos del Administrador</h2>

          <div class="form-group">
            <label>Nombre completo</label>

            <input
              type="text"
              [(ngModel)]="nombre"
              name="nombre"
              placeholder="Ingresá tu nombre completo"
            />
          </div>

          <div class="form-group">
            <label>Email</label>

            <input type="email" [(ngModel)]="email" name="email" placeholder="Ingresá tu email" />
          </div>

          <div class="form-group">
            <label>Contraseña</label>

            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Ingresá tu contraseña"
            />
          </div>

          <div class="form-group">
            <label>Repetir contraseña</label>

            <input
              type="password"
              [(ngModel)]="confirmarPassword"
              name="confirmarPassword"
              placeholder="Repetí tu contraseña"
            />
          </div>
        </div>

        <!-- VETERINARIA -->
        <div class="register-section">
          <h2>Datos de la Veterinaria</h2>

          <div class="form-group">
            <label>Nombre comercial</label>

            <input
              type="text"
              [(ngModel)]="nombreComercial"
              name="nombreComercial"
              placeholder="Ej: VetControl Animal"
            />
          </div>

          <div class="form-group">
            <label>Razón social</label>

            <input
              type="text"
              [(ngModel)]="razonSocial"
              name="razonSocial"
              placeholder="Razón social"
            />
          </div>

          <div class="form-group">
            <label>País</label>

            <input type="text" [(ngModel)]="pais" name="pais" placeholder="País" />
          </div>

          <div class="form-group">
            <label>Dirección</label>

            <input type="text" [(ngModel)]="direccion" name="direccion" placeholder="Dirección" />
          </div>

          <div class="form-group">
            <label>Teléfono</label>

            <input type="text" [(ngModel)]="telefono" name="telefono" placeholder="Teléfono" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-auth">Crear Veterinaria</button>

      <div class="login-link">
        ¿Ya tenés cuenta?

        <a routerLink="/login">Iniciar sesión</a>
      </div>
    </form>
  </div>
</div>
