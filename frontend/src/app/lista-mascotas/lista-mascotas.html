<mat-card class="page-container">
  <div class="cards-mascotas">
    <mat-card class="pet-card" *ngFor="let m of mascotasPaginadas">
      <!-- EDICIÓN -->
      <div *ngIf="mascotaEditandoId === m.id; else vistaNormal">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput [(ngModel)]="m.nombre" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Especie</mat-label>
          <input matInput [(ngModel)]="m.especie" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Raza</mat-label>
          <input matInput [(ngModel)]="m.raza" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Edad</mat-label>
          <input matInput type="number" [(ngModel)]="m.edad" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Dueño</mat-label>
          <input matInput [(ngModel)]="m.duenio" />
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="guardar(m)">Guardar</button>
      </div>

      <!-- VISTA NORMAL -->

      <ng-template #vistaNormal>
        <div class="pet-modern-card">
          <!-- FOTO -->

          <div class="pet-image">
            <img
              [src]="m.imagen ? m.imagen : 'https://cdn-icons-png.flaticon.com/512/616/616408.png'"
              alt="Mascota"
            />
          </div>

          <!-- INFO -->

          <div class="pet-info">
            <div class="pet-header">
              <div class="pet-title-row">
                <h2 class="pet-name">
                  {{ m.nombre }}
                </h2>

                <button
                  mat-icon-button
                  class="pet-menu"
                  [matMenuTriggerFor]="menu"
                  aria-label="Opciones de mascota"
                >
                  <mat-icon>more_vert</mat-icon>
                </button>
              </div>

              <div class="pet-badges">
                <span class="badge especie">
                  {{ m.especie }}
                </span>

                <span class="badge raza">
                  {{ m.raza }}
                </span>

                <span class="badge edad"> {{ m.edad }} años </span>
              </div>
            </div>

            <div class="pet-owner">
              <mat-icon>person</mat-icon>

              <span>
                {{ m.duenio }}
              </span>
            </div>

            <div
              class="pet-status"
              [class.ok]="m.vacunas.length > 0"
              [class.alert]="m.vacunas.length === 0"
            >
              <span
                class="status-dot"
                [class.ok]="m.vacunas.length > 0"
                [class.alert]="m.vacunas.length === 0"
              ></span>

              <span class="status-label"> Estado sanitario: </span>

              <span
                class="status-text"
                [class.ok]="m.vacunas.length > 0"
                [class.alert]="m.vacunas.length === 0"
              >
                {{ m.vacunas.length > 0 ? 'Al día' : 'Sin vacunas' }}
              </span>
            </div>

            <div class="pet-actions">
              <button mat-stroked-button color="primary" (click)="verFicha(m.id)">Ver ficha</button>

              <button mat-stroked-button color="primary" (click)="editar(m)">Editar</button>
            </div>
          </div>
        </div>

        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="eliminar(m.id)">
            <mat-icon color="warn"> delete </mat-icon>

            <span> Eliminar </span>
          </button>
        </mat-menu>
      </ng-template>
    </mat-card>
  </div>
  <mat-paginator
    [length]="mascotasFiltradas.length"
    [pageSize]="4"
    [pageSizeOptions]="[4]"
    showFirstLastButtons
    (page)="cambiarPagina($event)"
  >
  </mat-paginator>
</mat-card>
