@if (!esPaginaPublica()) {
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" [class.sidebar-open]="sidebarAbierto">
      <div class="logo-section">
        <div class="logo-icon">
          <mat-icon>pets</mat-icon>
        </div>

        <h2>VetControl</h2>
      </div>

      <nav class="menu">
        <a routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>

        <a routerLink="/mascotas" routerLinkActive="active">
          <mat-icon>pets</mat-icon>
          <span>Mascotas</span>
        </a>

        <a routerLink="/vacunas" routerLinkActive="active">
          <mat-icon>vaccines</mat-icon>
          <span>Vacunas</span>
        </a>

        <a routerLink="/consultas" routerLinkActive="active">
          <mat-icon>medical_services</mat-icon>
          <span>Consultas</span>
        </a>

        <a routerLink="/turnos" routerLinkActive="active">
          <mat-icon>calendar_month</mat-icon>
          <span>Turnos</span>
        </a>

        <a routerLink="/perfil" routerLinkActive="active">
          <mat-icon>person</mat-icon>
          <span>Perfil</span>
        </a>

        <a routerLink="/configuracion">
          <mat-icon>settings</mat-icon>
          <span>Configuración</span>
        </a>
      </nav>

      <div class="sidebar-company">
        <div class="company-avatar">🐾</div>

        <h3>VetControl</h3>

        <p>+54 11 2503 3874</p>
      </div>
    </aside>

    <!-- CONTENIDO -->
    <div class="main-content">
      <header class="topbar">
        <button class="menu-btn" (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>

          <span>
            {{ authService.usuarioActual()?.nombre }}
          </span>
        </div>

        <button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Cerrar sesión
        </button>
      </header>

      <div class="page-container">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
