  <!-- BUSCADOR -->

  <mat-form-field appearance="outline" class="buscador">
    <mat-label>Buscar mascota</mat-label>

    <input matInput [(ngModel)]="filtro" placeholder="Ej: Firulais" />
  </mat-form-field>

  <!-- CARDS -->

  <div class="cards-mascotas">
    <mat-card class="pet-card" *ngFor="let m of mascotasFiltradas">
      <!-- EDITAR -->

      <div *ngIf="mascotaEditandoId === m.id; else vistaNormal">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>

          <input matInput [(ngModel)]="m.nombre" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Especie</mat-label>

          <input matInput [(ngModel)]="m.especie" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Raza</mat-label>

          <input matInput [(ngModel)]="m.raza" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Edad</mat-label>

          <input matInput type="number" [(ngModel)]="m.edad" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Dueño</mat-label>

          <input matInput [(ngModel)]="m.duenio" />
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="guardar(m)">Guardar</button>
      </div>

      <!-- VISTA NORMAL -->

      <ng-template #vistaNormal>
        <div class="pet-modern-card">
          <!-- BANNER -->

          <div class="pet-banner"></div>

          <!-- FOTO -->

          <div class="pet-avatar-container">
            <img
              class="pet-avatar"
              [src]="m.imagen ? m.imagen : 'https://cdn-icons-png.flaticon.com/512/616/616408.png'"
              alt="mascota"
            />
          </div>

          <!-- CONTENIDO -->

          <div class="pet-content">
            <h2 class="pet-modern-name">
              {{ m.nombre }}
            </h2>

            <!-- TAGS -->

            <div class="pet-badges">
              <span class="badge especie">
                {{ m.especie }}
              </span>

              <span class="badge raza">
                {{ m.raza }}
              </span>

              <span class="badge edad"> {{ m.edad }} años </span>
            </div>

            <!-- DUEÑO -->

            <div class="pet-owner">
              <span> 👤 {{ m.duenio }} </span>
            </div>

            <!-- ESTADO -->

            <div
              class="status-box"
              [class.ok]="m.vacunas.length > 0"
              [class.alert]="m.vacunas.length === 0"
            >
              <span *ngIf="m.vacunas.length > 0"> 🟢 Vacunas al día </span>

              <span *ngIf="m.vacunas.length === 0"> 🔴 Sin vacunas </span>
            </div>

            <!-- BOTONES -->

            <div class="panel-buttons">
              <button mat-raised-button color="primary" (click)="verFicha(m.id)">
                👁 Ver ficha
              </button>

              <button mat-raised-button color="accent" (click)="editar(m)">✏ Editar</button>

              <button mat-raised-button color="warn" (click)="eliminar(m.id)">🗑 Eliminar</button>
            </div>
          </div>
        </div>
      </ng-template>
    </mat-card>
  </div>
</mat-card>
