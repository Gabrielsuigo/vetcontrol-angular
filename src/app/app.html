<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-section">
      <div class="logo-icon">
        <mat-icon>menu</mat-icon>
      </div>

      <h2>VetControl</h2>
    </div>

    <nav class="menu">
      <a routerLink="/dashboard">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a routerLink="/mascotas">
        <mat-icon>pets</mat-icon>
        <span>Mascotas</span>
      </a>

      <a routerLink="/historial">
        <mat-icon>vaccines</mat-icon>
        <span>Vacunas</span>
      </a>

      <a routerLink="/turnos">
        <mat-icon>calendar_month</mat-icon>
        <span>Turnos</span>
      </a>

      <a routerLink="/perfil">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
      </a>
    </nav>
  </aside>

  <!-- CONTENIDO -->
  <div class="main-content">
    <header class="topbar">
      <div class="user-info">
        <mat-icon>account_circle</mat-icon>

        <span>
          {{ authService.usuarioActual()?.nombre }}
        </span>
      </div>

      <button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </header>

    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
